<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>登录测试</title></head>
<body>
    <h1>登录测试（POST）</h1>
    <!-- method=post：用 POST 提交；action：提交到哪个接口 -->
    <form method="post" action="/api/login">
        <p>用户名: <input type="text" name="username"></p>
        <p>密　码: <input type="password" name="password"></p>
        <p><input type="submit" value="登录"></p>
    </form>

    <h1>登录测试（GET）</h1>
    <!-- method=get GET 提交；action：提交到哪个接口 -->
    <form method="get" action="/api/login">
        <p>用户名: <input type="text" name="username"></p>
        <p>密　码: <input type="password" name="password"></p>
        <p><input type="submit" value="登录"></p>
    </form>
</body>
</html>
